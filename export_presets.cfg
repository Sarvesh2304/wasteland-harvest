texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://art/ui/app_icon/icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.9.0.0"
application/product_version="0.9.0.0"
application/company_name=""
application/product_name="Wasteland Harvest"
application/file_description="Wasteland Harvest"
application/copyright=""
application/trademarks=""
application/export_angle=0
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\{archive_name}' -DestinationPath '{temp_dir}'
$action = New-ScheduledTaskAction -Execute '{temp_dir}\{exe_name}' -Argument '{cmd_args}'
$trigger = New-ScheduledTaskTrigger -Once -At (Get-Date)
$settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -ExecutionTimeLimit (New-TimeSpan -Days 1)
Register-ScheduledTask -TaskName 'debug_process' -Action $action -Trigger $trigger -Settings $settings -Force:$true
Start-ScheduledTask -TaskName 'debug_process'"
ssh_remote_deploy/cleanup_script="$tasks = Get-ScheduledTask -TaskName 'debug_process' -ErrorAction SilentlyContinue
if ($tasks) {
    Stop-ScheduledTask -TaskName 'debug_process'
    Unregister-ScheduledTask -TaskName 'debug_process' -Confirm:$false
}
$processes = Get-Process -Name '{exe_name}' -ErrorAction SilentlyContinue
if ($processes) {
    Stop-Process -Name '{exe_name}' -Force
}
Remove-Item -Recurse -Force '{temp_dir}'"

